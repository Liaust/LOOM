kind: loom.repos
schema_version: repos.contract.v0.4

repos:
  status: active
  defaults:
    sync: true
    backup: false
    index: true
    include:
      - "**/*.go"
      - "go.mod"
    exclude:
      - "vendor/**"
  watch_roots:
    - key: source
      path: source
      display_name: Source Trees
      backup: false
      exclude:
        - "vendor/**"
        - "tmp/**"
  members: []
