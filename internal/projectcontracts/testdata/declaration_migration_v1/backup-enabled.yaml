kind: loom.project_backup_policy
schema_version: backup.policy.v0.3
backup:
  enabled: true
  defaults:
    max_file_bytes: 4096
    max_batch_bytes: 8192
    max_pending_bytes: 9007199254740993
    include: ["**/*"]
    exclude: ["**/*.tmp"]
  roots:
    - key: documents
      path: data/docs
    - key: studies
      path: data/études
      max_file_bytes: 8192
      max_batch_bytes: 16384
