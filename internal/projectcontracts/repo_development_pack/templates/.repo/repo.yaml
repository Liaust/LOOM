kind: loom.repository_state
schema_version: repo.state.v1
repository:
  id: "<repository-id>"
  name: "<repository-name>"
  aliases: []
  role: primary
  purpose: "<short repository purpose>"
  topics: []
owner_project:
  id: {{.ProjectID}}
  slug: {{.Slug}}
branches:
  stable: "<stable-branch-if-known>"
  default: "<default-branch-if-known>"
source:
  tracking: git
  state_root: .repo
