<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="220 200 880 880" fill="none" role="img" aria-labelledby="title desc">
<title id="title">LOOM — Orange thread spool</title>
<desc id="desc">An isolated dark coffee bobbin wound with orange thread, on a transparent background. All visible forms are editable SVG vector paths and gradients.</desc>
<defs>
  <linearGradient id="base-side" x1="0" y1="0" x2=".98" y2=".55" objectBoundingBox="true">
    <stop stop-color="#663d2f"/><stop offset=".37" stop-color="#4a271c"/><stop offset=".78" stop-color="#36180f"/><stop offset="1" stop-color="#2f120b"/>
  </linearGradient>
  <linearGradient id="base-top" x1=".06" y1=".08" x2=".75" y2="1">
    <stop stop-color="#80503e"/><stop offset=".38" stop-color="#9a6049"/><stop offset=".65" stop-color="#794635"/><stop offset="1" stop-color="#4e281e"/>
  </linearGradient>
  <linearGradient id="top-side" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#663524"/><stop offset=".55" stop-color="#582b1e"/><stop offset="1" stop-color="#39180e"/>
  </linearGradient>
  <linearGradient id="top-face" x1=".02" y1="0" x2=".98" y2=".9">
    <stop stop-color="#714334"/><stop offset=".25" stop-color="#965c45"/><stop offset=".52" stop-color="#9a6249"/><stop offset=".82" stop-color="#87513c"/><stop offset="1" stop-color="#774333"/>
  </linearGradient>
  <radialGradient id="barrel" cx=".54" cy=".43" r=".8">
     <stop stop-color="#2b0f07"/><stop offset=".64" stop-color="#371408"/><stop offset="1" stop-color="#1d0b06"/>
  </radialGradient>
  <linearGradient id="orange-band" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#bc3d0b"/><stop offset=".15" stop-color="#df5b11"/><stop offset=".43" stop-color="#fe811d"/><stop offset=".58" stop-color="#ff8d23"/><stop offset=".78" stop-color="#ec6b13"/><stop offset="1" stop-color="#bd3f0d"/>
  </linearGradient>
  <linearGradient id="orange-bottom" x1="0" y1="0" x2=".94" y2=".15">
    <stop stop-color="#b8420c"/><stop offset=".4" stop-color="#f37818"/><stop offset=".62" stop-color="#ff8823"/><stop offset=".82" stop-color="#ff9229"/><stop offset="1" stop-color="#ed7419"/>
  </linearGradient>
  <linearGradient id="thread-sheen" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#ffc25b" stop-opacity=".11"/><stop offset=".52" stop-color="#ffb44a" stop-opacity="0"/><stop offset="1" stop-color="#611a06" stop-opacity=".15"/>
  </linearGradient>
  <linearGradient id="hole" x1="0" y1="0" x2=".5" y2="1">
     <stop stop-color="#170804"/><stop offset="1" stop-color="#260d07"/>
  </linearGradient>
</defs>
