backend = "glx";
vsync = true;
use-damage = true;
fading = false;
blur-method = "none";
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.28;
shadow-offset-x = -4;
shadow-offset-y = -4;
corner-radius = 10;
detect-client-opacity = true;

rules = (
  { match = "_GTK_FRAME_EXTENTS@"; shadow = false; },
  { match = "window_type = 'desktop' || window_type = 'dock' || fullscreen || (_NET_WM_STATE@ = '_NET_WM_STATE_MAXIMIZED_VERT' && _NET_WM_STATE@ = '_NET_WM_STATE_MAXIMIZED_HORZ')";
    corner-radius = 0; shadow = false; },
  { match = "class_g = 'Xfce4-screensaver'"; corner-radius = 0; shadow = false; }
);
