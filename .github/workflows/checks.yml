name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./cmd/...
      - run: go test ./internal/cloudstorage -run '^TestRestoreCleanupLinuxFixtureAuthority$' -v
      - run: go test ./...
      - run: go vet ./...
      - run: go run ./cmd/loom --json docs --docs-dir docs status
      - run: go run ./cmd/loom agent pack validate --pack-dir ai-loom-pack
